<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>موكا - مساعدك الذكي</title>
<style>
:root{--bg:#12100e;--panel:#1c1815;--me:#3a2a1d;--bot:#211d19;--ink:#f2e8dc;--dim:#a39484;--acc:#d09a5f}
@media (prefers-color-scheme:light){:root{--bg:#f6f1ea;--panel:#ebe3d8;--me:#e1c9aa;--bot:#fffaf3;--ink:#2a2018;--dim:#7a6a5a;--acc:#9a5b22}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--panel)}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
h1 span{color:var(--acc)}
button{font:inherit;color:inherit;cursor:pointer}
#new{background:none;border:1px solid var(--dim);border-radius:999px;padding:5px 14px;color:var(--dim)}
#log{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 14px;border-radius:16px;line-height:1.75;white-space:pre-wrap;word-wrap:break-word;font-size:16px}
.me{align-self:flex-start;background:var(--me);border-bottom-right-radius:4px}
.bot{align-self:flex-end;background:var(--bot);border:1px solid var(--panel);border-bottom-left-radius:4px}
.hint{color:var(--dim);text-align:center;margin:auto;font-size:15px;line-height:2}
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--panel)}
textarea{flex:1;resize:none;max-height:120px;background:var(--panel);color:var(--ink);border:1px solid transparent;border-radius:14px;padding:10px 14px;font:inherit;font-size:16px}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#send{background:var(--acc);color:#1a1008;border:0;border-radius:14px;padding:0 18px;font-weight:700}
#send:disabled{opacity:.5}
</style>
</head>
<body>
<header><h1>موكا<span>.</span>AI</h1><button id="new" type="button">محادثة جديدة</button></header>
<main id="log" aria-live="polite"></main>
<form id="f">
<textarea id="q" rows="1" placeholder="اكتب سؤالك أو مسألتك..." autocomplete="off"></textarea>
<button id="send" type="submit">إرسال</button>
</form>
<script>
var log=document.getElementById("log"),q=document.getElementById("q"),send=document.getElementById("send");
var msgs=[];
try{msgs=JSON.parse(localStorage.getItem("moka")||"[]")}catch(e){msgs=[]}
function save(){try{localStorage.setItem("moka",JSON.stringify(msgs.slice(-30)))}catch(e){}}
function add(role,text){
  var d=document.createElement("div");
  d.className="m "+(role==="user"?"me":"bot");
  d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;
}
function hint(){
  log.innerHTML="";
  var h=document.createElement("div");h.className="hint";
  h.textContent="اسألني عن أي شيء: مسائل رياضية، معلومات عامة ودينية، برمجة، ترجمة. أفهم الفصحى والعامية.";
  log.appendChild(h);
}
function render(){
  log.innerHTML="";
  if(!msgs.length){hint();return}
  msgs.forEach(function(m){add(m.role,m.text)});
}
document.getElementById("new").onclick=function(){msgs=[];save();render()};
q.addEventListener("input",function(){q.style.height="auto";q.style.height=Math.min(q.scrollHeight,120)+"px"});
document.getElementById("f").onsubmit=function(e){
  e.preventDefault();
  var t=q.value.trim();if(!t||send.disabled)return;
  if(!msgs.length)log.innerHTML="";
  msgs.push({role:"user",text:t});add("user",t);q.value="";q.style.height="auto";
  send.disabled=true;var w=add("bot","...");
  fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:msgs.slice(-12)})})
  .then(function(r){return r.json()})
  .then(function(j){w.textContent=j.reply;msgs.push({role:"model",text:j.reply});save()})
  .catch(function(){w.textContent="تعذّر الاتصال بالخادم. قد يكون نائماً، أعد المحاولة بعد 30 ثانية."})
  .finally(function(){send.disabled=false;log.scrollTop=log.scrollHeight});
};
render();
</script>
</body>
</html>
